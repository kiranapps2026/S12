[project]
name = "supragents"
version = "0.1.0"
description = "SuprAgents: Multi-tenant durable execution kernel for AI workers"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
authors = [{ name = "SuprAgents Team" }]

dependencies = [
    "fastapi>=0.110",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "httpx>=0.27",
    "cryptography>=41",
    "prometheus-client>=0.19",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "tenacity>=8.2",
    "aio-pika>=9.4",
    "pyyaml>=6.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0",
    "mypy>=1.9", "ruff>=0.3", "pre-commit>=3.6",
    "mutmut>=2.4", "hypothesis>=6.98", "respx>=0.21", "faker>=22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -v"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
    "contract: Contract tests",
    "conformance: Conformance tests",
    "failure: Failure mode tests",
]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mutmut]
paths_to_mutate = ["src/contracts/", "src/engine/", "src/db/"]
paths_to_ignore = ["tests/", "__pycache__/"]
backup = false
