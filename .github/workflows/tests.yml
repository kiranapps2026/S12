name: tests
on:
  push:
    branches: [s0-s11-repair, s0-s11-baseline]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: supragents_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:pw@localhost:5432/supragents_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Owner certifier (must be 19/19)
        run: python tools/owner_certify.py
      - name: Unit and integration tests
        run: python -m pytest tests -q
      - name: PostgreSQL tests (real RLS, non-superuser role)
        run: python -m pytest tests_postgres -q

  docs:
    # Specification consistency and S12 tracker rules. Standard library only, no database.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Document consistency (gate vs STATE_TRANSITIONS vs DATA_CONTRACTS, rulings, versions, fences)
        run: python tools/doc_consistency.py
      - name: S12 tracker rules
        run: python tools/s12_tracker.py check
